[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a1580-openhtf"
version = "0.1.0"
description = "OpenHTF plug for the ACS A1580 ultrasonic pulser-receiver"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "openhtf>=1.6",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "jsonschema",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a1580_openhtf"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
# capture.py is added by SPEC-capture.
files = ["src/a1580_openhtf/stream.py", "src/a1580_openhtf/capture.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
